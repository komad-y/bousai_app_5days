<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <title>{% block title %}防災アプリ{% endblock %}</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=M+PLUS+Rounded+1c:wght@400;500;700;800&display=swap" rel="stylesheet">
  <style>
    :root {
      --blue: #1953a6;
      --blue-dark: #123c7d;
      --ink: #19304f;
      --muted: #65758a;
      --surface: #ffffff;
      --canvas: #f4f8fc;
      --line: #e4ebf3;
      --green: #168849;
      font-family: "M PLUS Rounded 1c", sans-serif;
      color: var(--ink);
    }

    * { box-sizing: border-box; }
    body { margin: 0; background: var(--canvas); }
    body.display-pc main { width: min(100% - 56px, 1200px); }
    body.display-mobile main { width: min(100% - 28px, 560px); margin-top: 20px; }
    body.display-mobile .header-inner { width: min(100% - 28px, 560px); }
    body.display-mobile input,
    body.display-mobile select,
    body.display-mobile textarea,
    body.display-mobile button { max-width: 100%; }
    body.display-mobile table { display: block; max-width: 100%; overflow-x: auto; }
    .site-header {
      height: 70px;
      background: linear-gradient(110deg, var(--blue-dark), #2863bb);
      color: white;
      box-shadow: 0 3px 14px rgba(25, 62, 115, .18);
    }
    .header-inner {
      width: min(100% - 40px, 980px);
      height: 100%;
      margin: auto;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }
    .brand { margin: 0; font-size: 1.55rem; letter-spacing: .04em; }
    .brand-link { color: inherit; text-decoration: none; }
    .brand-link:focus-visible { outline: 2px solid white; outline-offset: 4px; }
    .menu-button {
      border: 0;
      background: transparent;
      color: white;
      font-size: 1.8rem;
      line-height: 1;
      cursor: pointer;
    }
    .display-mode-bar {
      display: flex;
      justify-content: flex-end;
      width: min(100% - 40px, 980px);
      margin: 12px auto 0;
    }
    .display-mode-control {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      padding: 4px;
      background: var(--surface);
      border: 1px solid var(--line);
      border-radius: 8px;
      box-shadow: 0 3px 12px rgba(22, 54, 96, .08);
    }
    .display-mode-label { color: var(--muted); font-size: .78rem; font-weight: 700; padding: 0 4px; }
    .display-mode-button {
      border: 0;
      border-radius: 5px;
      padding: 6px 9px;
      background: transparent;
      color: var(--muted);
      font: inherit;
      font-size: .78rem;
      cursor: pointer;
    }
    .display-mode-button:hover { background: #eef4fb; color: var(--blue); }
    .display-mode-button.is-selected { background: var(--blue); color: white; }
    .site-nav {
      display: none;
      position: absolute;
      top: 70px;
      right: max(20px, calc((100% - 980px) / 2));
      z-index: 1000;
      padding: 10px;
      background: white;
      border: 1px solid var(--line);
      border-radius: 8px;
      box-shadow: 0 8px 22px rgba(22, 54, 96, .18);
    }
    .site-nav.is-open { display: grid; gap: 2px; }
    .site-nav a { padding: 9px 12px; color: var(--ink); text-decoration: none; white-space: nowrap; }
    .site-nav a:hover { background: #eef4fb; color: var(--blue); }
    main { width: min(100% - 40px, 910px); margin: 34px auto 64px; }
    @media (max-width: 600px) {
      .header-inner, main { width: min(100% - 28px, 910px); }
      .site-header { height: 62px; }
      .brand { font-size: 1.25rem; }
      main { margin-top: 20px; }
      .site-nav { top: 62px; right: 14px; }
      .display-mode-bar { width: min(100% - 28px, 560px); justify-content: stretch; }
      .display-mode-control { width: 100%; justify-content: space-between; }
      .display-mode-label { white-space: nowrap; }
      .display-mode-button { flex: 1; }
    }
  </style>
</head>
<body>
  <header class="site-header">
    <div class="header-inner">
      <h1 class="brand"><a class="brand-link" href="{{ url_for('index') }}">防災アプリ</a></h1>
      <button class="menu-button" type="button" aria-label="メニューを開く" aria-expanded="false" aria-controls="site-nav">☰</button>
    </div>
    <nav id="site-nav" class="site-nav" aria-label="メインメニュー">
      <a href="/">ホーム</a>
      <a href="/shelter_search">避難所検索</a>
      <a href="/shelter_register">避難所登録</a>
      <a href="/board">指示・発信ボード</a>
      {% if session.logged_in %}
        <a href="/logout">ログアウト（{{ session.username or '管理者' }}）</a>
      {% else %}
        <a href="/login">ログイン</a>
      {% endif %}
    </nav>
  </header>

  <div class="display-mode-bar">
    <div class="display-mode-control" role="group" aria-label="表示サイズ">
      <span class="display-mode-label">表示</span>
      <button class="display-mode-button" type="button" data-display-mode="auto">自動</button>
      <button class="display-mode-button" type="button" data-display-mode="pc">PC</button>
      <button class="display-mode-button" type="button" data-display-mode="mobile">スマホ</button>
    </div>
  </div>

  <main>
    {% block content %}{% endblock %}
  </main>
  <script>
    document.addEventListener('DOMContentLoaded', function() {
      const menuButton = document.querySelector('.menu-button');
      const siteNav = document.getElementById('site-nav');
      menuButton.addEventListener('click', function() {
        const isOpen = siteNav.classList.toggle('is-open');
        menuButton.setAttribute('aria-expanded', String(isOpen));
      });

      const displayModeButtons = document.querySelectorAll('[data-display-mode]');
      const displayModeKey = 'bousai-display-mode';
      const applyDisplayMode = function(mode) {
        document.body.classList.remove('display-pc', 'display-mobile');
        if (mode === 'pc') document.body.classList.add('display-pc');
        if (mode === 'mobile') document.body.classList.add('display-mobile');
        displayModeButtons.forEach(function(button) {
          const selected = button.dataset.displayMode === mode;
          button.classList.toggle('is-selected', selected);
          button.setAttribute('aria-pressed', String(selected));
        });
      };
      const savedMode = localStorage.getItem(displayModeKey) || 'auto';
      applyDisplayMode(['auto', 'pc', 'mobile'].includes(savedMode) ? savedMode : 'auto');
      displayModeButtons.forEach(function(button) {
        button.addEventListener('click', function() {
          const mode = button.dataset.displayMode;
          localStorage.setItem(displayModeKey, mode);
          applyDisplayMode(mode);
        });
      });
    });
  </script>
</body>
</html>
